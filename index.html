<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GATE OF PROVADIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #141210; color: #FFEFC1; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        #vignette { position: fixed; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%); pointer-events: none; }
        #fade-in { position: fixed; inset: 0; background: #000; z-index: 100; transition: opacity 2.6s ease; }
        .overlay { position: fixed; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
        #top-center { top: 5vh; left: 0; width: 100%; text-align: center; }
        #top-center h1 { font-family: 'Cinzel', serif; font-size: 2.5rem; letter-spacing: 0.4em; margin: 0; color: #FFEFC1; }
        #top-center p { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.2em; margin-top: 0.5rem; opacity: 0.8; }
        #bottom-left { bottom: 5vh; left: 5vw; text-align: left; }
        #bottom-left div { font-size: 0.9rem; line-height: 1.6; }
        #bottom-right { bottom: 5vh; right: 5vw; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.6; }
        #flip-btn-container { bottom: 5vh; left: 0; width: 100%; text-align: center; pointer-events: auto; }
        #flip-btn { background: transparent; border: 1px solid #C9A227; color: #FFEFC1; padding: 0.8rem 2rem; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.1em; }
        #flip-btn:hover { background: #C9A227; color: #141210; }
    </style>
</head>
<body>
    <div id="fade-in"></div>
    <div id="vignette"></div>
    <div id="top-center" class="overlay">
        <h1>PROVADIA</h1>
        <p>THE GATE · EUROPE'S FIRST TOWN OF RECORD</p>
    </div>
    <div id="bottom-left" class="overlay">
        <div><strong>THE GOLDEN WALL</strong><br>0 / 47 bricks laid · one is waiting</div>
    </div>
    <div id="bottom-right" class="overlay">TAP THE COIN</div>
    <div id="flip-btn-container" class="overlay">
        <button id="flip-btn">FLIP THE COIN</button>
    </div>

    <script type="module">
        import * as THREE from './three.module.min.js';

        const PALETTE = { dark: 0x141210, gold: 0xC9A227, lightGold: 0xFFEFC1, deepGold: 0x6B4A12, darkGold: 0x3D2A08, salt: 0xF4EFE6 };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(PALETTE.dark);
        scene.fog = new THREE.FogExp2(PALETTE.dark, 0.028);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(-10, 15, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x000000, 0.2);
        scene.add(hemiLight);

        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(50, 64),
            new THREE.MeshStandardMaterial({ color: PALETTE.dark, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.62;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- THE GATE ---
        const gateGroup = new THREE.Group();
        const pillarGeo = new THREE.BoxGeometry(1.5, 8.6, 1.5);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const goldTrimMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold, metalness: 0.8, roughness: 0.2 });

        const createPillar = (x) => {
            const p = new THREE.Group();
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            p.add(pillar);

            const cap = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.4, 1.7), goldTrimMat);
            cap.position.y = 4.3;
            p.add(cap);

            const trim = new THREE.Mesh(new THREE.BoxGeometry(0.1, 8.6, 0.1), goldTrimMat);
            trim.position.set(0.76, 0, 0.76);
            p.add(trim);

            p.position.set(x, 4, 7);
            return p;
        };

        gateGroup.add(createPillar(4.1));
        gateGroup.add(createPillar(-4.1));

        const lintel = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.8, 1.5), pillarMat);
        lintel.position.set(0, 8.6, 7);
        lintel.castShadow = true;
        gateGroup.add(lintel);

        const lintelTrim = new THREE.Mesh(new THREE.BoxGeometry(9.7, 0.1, 1.7), goldTrimMat);
        lintelTrim.position.set(0, 8.8, 7);
        gateGroup.add(lintelTrim);

        scene.add(gateGroup);

        // --- THE COIN ---
        const coinGroup = new THREE.Group();
        const coinGeo = new THREE.CylinderGeometry(2, 2, 0.36, 64);
        const coinMat = new THREE.MeshStandardMaterial({ color: PALETTE.gold, metalness: 0.9, roughness: 0.1 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.castShadow = true;
        coinGroup.add(coin);

        const frontGroup = new THREE.Group();
        frontGroup.position.z = 0.181;

        // 5 brick courses
        for (let i = 0; i < 5; i++) {
            for (let j = -3; j <= 3; j++) {
                const brick = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.05), goldTrimMat);
                brick.position.set(j * 0.4, -0.6 + i * 0.2, 0);
                frontGroup.add(brick);
            }
        }

        // 7 merlon boxes
        for (let i = 0; i < 7; i++) {
            const angle = (i / 6) * Math.PI - Math.PI / 2; // Arc top
            const merlon = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.05), goldTrimMat);
            merlon.position.set(Math.cos(angle + Math.PI/2) * 1.6, Math.sin(angle + Math.PI/2) * 1.6, 0);
            merlon.rotation.z = angle + Math.PI/2;
            frontGroup.add(merlon);
        }

        // 47 rim spheres
        for (let i = 0; i < 47; i++) {
            const angle = (i / 47) * Math.PI * 2;
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), goldTrimMat);
            sphere.position.set(Math.cos(angle) * 1.76, Math.sin(angle) * 1.76, 0);
            frontGroup.add(sphere);
        }
        coinGroup.add(frontGroup);

        const backGroup = new THREE.Group();
        backGroup.position.z = -0.181;

        const sun = new THREE.Mesh(new THREE.CircleGeometry(0.8, 32), new THREE.MeshStandardMaterial({ color: PALETTE.lightGold, emissive: PALETTE.gold, emissiveIntensity: 0.5 }));
        backGroup.add(sun);

        for (let i = 1; i <= 3; i++) {
            const torus = new THREE.Mesh(new THREE.TorusGeometry(i * 0.4, 0.03, 16, 64), goldTrimMat);
            torus.rotation.x = Math.PI / 2;
            backGroup.add(torus);
        }

        for (let i = 0; i < 47; i++) {
            const angle = (i / 47) * Math.PI * 2;
            const bead = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), goldTrimMat);
            bead.position.set(Math.cos(angle) * 1.76, Math.sin(angle) * 1.76, 0);
            backGroup.add(bead);
        }
        coinGroup.add(backGroup);

        coinGroup.position.set(0, 2.35, 0);
        scene.add(coinGroup);

        // --- THE GOLDEN WALL ---
        const wallGroup = new THREE.Group();
        const wallCanvas = document.createElement('canvas');
        wallCanvas.width = 2048; wallCanvas.height = 768;
        const ctx = wallCanvas.getContext('2d');
        ctx.fillStyle = '#141210'; ctx.fillRect(0, 0, 2048, 768);
        ctx.strokeStyle = '#C9A227'; ctx.lineWidth = 2;
        const slotW = 120, slotH = 60, padX = 100, padY = 80;
        const rows = [12, 12, 12, 11];
        const slotPositions = [];
        let slotIdx = 0;
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < rows[r]; c++) {
                const x = padX + c * (slotW + 20) + (rows[r] === 11 ? 60 : 0);
                const y = padY + r * (slotH + 40);
                ctx.strokeRect(x, y, slotW, slotH);
                slotPositions.push({ x: (x + slotW/2)/1024 - 1, y: (y + slotH/2)/384 - 1 });
                slotIdx++;
            }
        }
        const wallTex = new THREE.CanvasTexture(wallCanvas);
        const wallGeo = new THREE.PlaneGeometry(27, 10.1);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, transparent: true });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(0, 4.5, -8.5);
        wallGroup.add(wall);

        const waitBrickGeo = new THREE.PlaneGeometry(0.8, 0.4);
        const waitBrickMat = new THREE.MeshBasicMaterial({ color: PALETTE.gold, transparent: true, opacity: 0.5 });
        const waitBrick = new THREE.Mesh(waitBrickGeo, waitBrickMat);
        waitBrick.position.set(slotPositions[0].x * 13.5, slotPositions[0].y * 5.05 + 4.5, -8.49);
        wallGroup.add(waitBrick);
        scene.add(wallGroup);

        // --- SALT DUST ---
        const dustCanvas = document.createElement('canvas');
        dustCanvas.width = 32; dustCanvas.height = 32;
        const dctx = dustCanvas.getContext('2d');
        const grad = dctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(244,239,230,0.8)'); grad.addColorStop(1, 'rgba(244,239,230,0)');
        dctx.fillStyle = grad; dctx.fillRect(0, 0, 32, 32);
        const dustTex = new THREE.CanvasTexture(dustCanvas);
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(380 * 3);
        for (let i = 0; i < 380 * 3; i++) dustPos[i] = (Math.random() - 0.5) * 40;
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({ size: 0.2, map: dustTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
        const saltDust = new THREE.Points(dustGeo, dustMat);
        scene.add(saltDust);

        // --- FLIGHT ---
        const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 2.35, 31), new THREE.Vector3(0, 2.35, 15), new THREE.Vector3(0, 2.35, 7), new THREE.Vector3(0, 2.35, 6.4)]);
        const shot = new URLSearchParams(window.location.search).get('shot');
        const flightDuration = 10.5;
        let startTime = null;

        const smootherstep = t => t * t * t * (t * (t * 6 - 15) + 10);

        // --- COIN FLIP ---
        let flipProgress = 0, isFlipping = false;
        const triggerFlip = () => {
            if (isFlipping) return;
            isFlipping = true; flipProgress = 0;
        };
        window.addEventListener('click', triggerFlip);
        document.getElementById('flip-btn').addEventListener('click', (e) => { e.stopPropagation(); triggerFlip(); });

        const resize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', resize);

        const animate = (time) => {
            if (!startTime) startTime = time;
            const elapsed = (time - startTime) / 1000;
            let t = Math.min(elapsed / flightDuration, 1);
            if (shot !== null) t = parseFloat(shot);

            const flightT = smootherstep(t);
            const pos = curve.getPointAt(flightT);
            camera.position.copy(pos);
            camera.lookAt(0, 2.35, 0);

            if (t >= 1) {
                camera.position.y += Math.sin(time * 0.001) * 0.05;
                camera.position.x += Math.cos(time * 0.0015) * 0.02;
            }

            if (t > 0.86) {
                document.querySelectorAll('.overlay').forEach(el => el.style.opacity = '1');
                document.getElementById('fade-in').style.opacity = '0';
            }

            if (isFlipping) {
                flipProgress += 0.016 / 1.5;
                if (flipProgress >= 1) { flipProgress = 1; isFlipping = false; }
                coinGroup.rotation.y = flipProgress * Math.PI;
            }

            waitBrick.material.opacity = 0.3 + Math.sin(time * 0.003) * 0.2;
            saltDust.position.y += 0.005;
            if (saltDust.position.y > 10) saltDust.position.y = -10;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
    </script>
</body>
</html>
